<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
  <title id="title">Tengiz Kiknadze, Senior iOS Developer</title>
  <desc id="desc">Profile banner. Swift, SwiftUI, UIKit, Swift Concurrency. An iPhone outline lists three App Store apps: Miroa, Shelft and NovaThink.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .cur  { animation: blink 1.2s steps(1) infinite; }
    .row  { animation: rise .7s ease-out both; }
    .r2   { animation-delay: .2s; }
    .r3   { animation-delay: .4s; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes rise  { from { transform: translateY(6px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .cur, .row { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FA"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C8D1DA"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect x="480" y="0" width="400" height="260" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="880" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="260" fill="url(#bg)"/>
    <rect x="480" y="0" width="400" height="260" fill="url(#dots)" mask="url(#dotmask)"/>

    <!-- left: identity -->
    <rect x="48" y="62" width="3" height="140" rx="1.5" fill="#CF3F1E"/>
    <text x="68" y="116" class="sans" font-size="54" font-weight="800" letter-spacing="-1.2" fill="#1F2328">Tengiz Kiknadze</text>
    <text x="70" y="154" class="sans" font-size="26" font-weight="500" fill="#424A53">Senior iOS Developer</text>
    <rect class="cur" x="70" y="180" width="10" height="19" fill="#CF3F1E"/>
    <text x="92" y="196" class="mono" font-size="18" fill="#59636E">Swift / SwiftUI / UIKit / Swift Concurrency</text>

    <!-- right: phone with the three shipped apps -->
    <rect x="640" y="36" width="190" height="300" rx="28" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="2"/>
    <rect x="713" y="50" width="44" height="10" rx="5" fill="#D1D9E0"/>

    <g class="row">
      <rect x="658" y="78" width="44" height="44" rx="11" fill="#CF3F1E" fill-opacity=".14" stroke="#CF3F1E" stroke-width="1.5"/>
      <text x="680" y="107" class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="#CF3F1E">M</text>
      <text x="716" y="106" class="sans" font-size="18" font-weight="600" fill="#1F2328">Miroa</text>
    </g>
    <g class="row r2">
      <rect x="658" y="134" width="44" height="44" rx="11" fill="#CF3F1E" fill-opacity=".14" stroke="#CF3F1E" stroke-width="1.5"/>
      <text x="680" y="163" class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="#CF3F1E">S</text>
      <text x="716" y="162" class="sans" font-size="18" font-weight="600" fill="#1F2328">Shelft</text>
    </g>
    <g class="row r3">
      <rect x="658" y="190" width="44" height="44" rx="11" fill="#CF3F1E" fill-opacity=".14" stroke="#CF3F1E" stroke-width="1.5"/>
      <text x="680" y="219" class="sans" font-size="20" font-weight="700" text-anchor="middle" fill="#CF3F1E">N</text>
      <text x="716" y="218" class="sans" font-size="18" font-weight="600" fill="#1F2328">NovaThink</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="259" rx="13.5" fill="none" stroke="#D1D9E0"/>
</svg>
